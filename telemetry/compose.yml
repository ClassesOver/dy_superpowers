services:
  openobserve:
    image: docker.1ms.run/openobserve/openobserve:v1.1.2
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:-admin@example.com}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:-LocalTrace123!}
      ZO_DATA_DIR: /data
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
      ZO_TELEMETRY: "false"
    volumes:
      - openobserve-data:/data
    ports:
      - "127.0.0.1:33047:5080"
    restart: unless-stopped

  otel-collector:
    image: docker.m.daocloud.io/otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yml"]
    environment:
      OPENOBSERVE_ROOT_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:-admin@example.com}
      OPENOBSERVE_ROOT_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:-LocalTrace123!}
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:33048:4317"
      - "127.0.0.1:33049:4318"
    depends_on:
      - openobserve
    restart: unless-stopped

volumes:
  openobserve-data:
