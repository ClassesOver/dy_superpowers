[project]
name = "dy-superpowers-mcp"
version = "0.1.0"
description = "dy_superpowers Codex 插件的工作区级 MCP 运行时"
requires-python = ">=3.12"
dependencies = [
    "basic-memory==0.23.2",
    "mcp[cli]>=2,<3",
    "jsonschema>=4.20,<5",
    "requests>=2.32,<3",
    "weasyprint>=60",
    "python-docx>=1.1,<2",
    "pypdf>=4,<7",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pyyaml>=6,<7",
    "pypdf>=4,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
